<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180" role="img" aria-label="Garrafeira">
  <!-- A estante redonda: aro dourado, arco central com a garrafa, e seis
       fundos de garrafa nas prateleiras dos lados. O dourado é a madeira,
       o bordô é o fundo, e os fundos das garrafas são os círculos escuros.
       Desenhado para ler bem aos 32px: traços grossos, poucas peças. -->
  <rect width="180" height="180" rx="40" fill="#3d1220"/>

  <!-- prateleiras dos lados (por baixo do aro, para o aro as cortar) -->
  <g stroke="#d7b183" stroke-width="6" stroke-linecap="round">
    <path d="M28 74h42M110 74h42M28 106h42M110 106h42"/>
  </g>

  <!-- fundos de garrafa: 3 de cada lado -->
  <g>
    <circle cx="48" cy="56" r="13" fill="#1c0a12"/><circle cx="48" cy="56" r="8.5" fill="#7b2438"/>
    <circle cx="48" cy="90" r="13" fill="#1c0a12"/><circle cx="48" cy="90" r="8.5" fill="#7b2438"/>
    <circle cx="48" cy="124" r="13" fill="#1c0a12"/><circle cx="48" cy="124" r="8.5" fill="#7b2438"/>
    <circle cx="132" cy="56" r="13" fill="#1c0a12"/><circle cx="132" cy="56" r="8.5" fill="#7b2438"/>
    <circle cx="132" cy="90" r="13" fill="#1c0a12"/><circle cx="132" cy="90" r="8.5" fill="#7b2438"/>
    <circle cx="132" cy="124" r="13" fill="#1c0a12"/><circle cx="132" cy="124" r="8.5" fill="#7b2438"/>
  </g>

  <!-- aro exterior -->
  <circle cx="90" cy="90" r="72" fill="none" stroke="#d7b183" stroke-width="7"/>

  <!-- arco central: as duas colunas que emolduram a garrafa -->
  <path d="M72 154V70a18 18 0 0 1 36 0v84" fill="none" stroke="#d7b183" stroke-width="7" stroke-linecap="round"/>

  <!-- a garrafa: silhueta clara, o vinho lá dentro, rótulo com a coroa -->
  <path d="M86 56h8v14c0 5 9 8 9 16v58a3 3 0 0 1-3 3H80a3 3 0 0 1-3-3V86c0-8 9-11 9-16z" fill="#f0e0c4"/>
  <path d="M87.5 60h5v11c0 6 9 9 9 16.5v54a1.5 1.5 0 0 1-1.5 1.5H81a1.5 1.5 0 0 1-1.5-1.5V87.5c0-7.5 9-10.5 9-16.5z" fill="#5e1226"/>
  <rect x="77" y="104" width="26" height="24" fill="#f0e0c4"/>
  <!-- coroa + filetes do rótulo -->
  <path d="M84 112l2.5 3 3.5-4.5 3.5 4.5 2.5-3v4.5H84z" fill="#a9832f"/>
  <g stroke="#a9832f" stroke-width="1.6" stroke-linecap="round">
    <path d="M82.5 121h15M85 125h10"/>
  </g>
</svg>
